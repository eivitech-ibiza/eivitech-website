name: Harden scheduled newsletter implementation

on:
  push:
    branches:
      - feat/scheduled-newsletters
    paths:
      - scripts/harden-scheduled-newsletters.trigger

permissions:
  contents: write

concurrency:
  group: harden-scheduled-newsletters
  cancel-in-progress: true

jobs:
  patch-test-and-commit:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: feat/scheduled-newsletters
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Apply reviewed hardening patch
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          path = Path("scripts/harden-scheduled-newsletters.py")
          source = path.read_text(encoding="utf-8")
          needle = "    '''  assert.match(marketingSource, /\\blistResendSegments\\b/);"
          replacement = "    r'''  assert.match(marketingSource, /\\blistResendSegments\\b/);"
          count = source.count(needle)
          if count != 2:
              raise RuntimeError(f"Expected two Resend pool regex strings, found {count}")
          path.write_text(source.replace(needle, replacement), encoding="utf-8")
          PY
          python scripts/harden-scheduled-newsletters.py
          python - <<'PY'
          from pathlib import Path

          frontend_guard = Path("scripts/email-marketing-safe-send.test.mjs")
          frontend_source = frontend_guard.read_text(encoding="utf-8")
          old_frontend = r'''  assert.equal((patchRoute.match(/\bstatus\s*=/g) || []).length, 1);'''
          new_frontend = r'''  assert.equal((patchRoute.match(/\bstatus\s*=\s*\$8/g) || []).length, 1);'''
          frontend_count = frontend_source.count(old_frontend)
          if frontend_count != 1:
              raise RuntimeError(f"Expected one draft status guard, found {frontend_count}")
          frontend_guard.write_text(frontend_source.replace(old_frontend, new_frontend), encoding="utf-8")

          api_guard = Path("api/src/marketingSchedulingIntegration.test.ts")
          api_source = api_guard.read_text(encoding="utf-8")
          old_api = r'''  assert.match(delivery, /sendResendBroadcast\(broadcastId, isoString\(campaign\.scheduled_at\)\)/);'''
          new_api = r'''  assert.match(delivery, /sendResendBroadcast\([\s\S]*?broadcastId,[\s\S]*?isoString\(campaign\.scheduled_at\),[\s\S]*?confirmationAttemptId/);'''
          api_count = api_source.count(old_api)
          if api_count != 1:
              raise RuntimeError(f"Expected one Broadcast send integration guard, found {api_count}")
          api_guard.write_text(api_source.replace(old_api, new_api), encoding="utf-8")
          PY
          git diff --check

      - name: Prepare candidate commit
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            api/README.md \
            api/src/campaignMetrics.ts \
            api/src/marketing.ts \
            api/src/marketingCampaignDelivery.ts \
            api/src/marketingConcurrencyIntegration.test.ts \
            api/src/marketingSchedulingIntegration.test.ts \
            api/src/resendBroadcastScheduling.test.ts \
            api/src/resendMarketing.ts \
            api/src/resendSegmentPool.test.ts \
            scripts/email-marketing-safe-send.test.mjs \
            scripts/marketing-scheduling.test.mjs \
            src/components/marketing/CampaignWorkspace.tsx \
            src/lib/marketing.ts
          git rm -f \
            scripts/harden-scheduled-newsletters.py \
            scripts/harden-scheduled-newsletters.trigger \
            .github/workflows/harden-scheduled-newsletters.yml
          git commit -m "fix(marketing): harden scheduled send concurrency"

      - name: Use public npm registry
        run: npm config set registry https://registry.npmjs.org/

      - name: Install frontend dependencies
        run: npm ci

      - name: Type-check frontend
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test frontend
        run: npm test

      - name: Build frontend
        run: npm run build
        env:
          SITE_URL: https://eivitech.com
          VITE_SITE_URL: https://eivitech.com

      - name: Install API dependencies
        run: npm --prefix api install

      - name: Test API with mocked provider calls
        run: npm --prefix api test

      - name: Build API
        run: npm --prefix api run build

      - name: Push verified commit
        shell: bash
        run: |
          set -euo pipefail
          git push origin HEAD:feat/scheduled-newsletters
