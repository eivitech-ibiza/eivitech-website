name: Apply scheduled newsletter implementation

on:
  push:
    branches:
      - feat/scheduled-newsletters
    paths:
      - scripts/apply-scheduled-newsletters.trigger

permissions:
  contents: write

concurrency:
  group: apply-scheduled-newsletters
  cancel-in-progress: true

jobs:
  apply-test-and-commit:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: feat/scheduled-newsletters
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Decode and apply patch
        shell: bash
        run: |
          set -euo pipefail
          cat scripts/apply-scheduled-newsletters.py.gz.b64.part* | base64 --decode | gzip --decompress > scripts/apply-scheduled-newsletters.py
          python scripts/apply-scheduled-newsletters.py
          python scripts/finalize-scheduled-newsletters.py
          git diff --check

      - name: Prepare implementation commit locally
        shell: bash
        run: |
          set -euo pipefail
          rm -f scripts/apply-scheduled-newsletters.py
          git rm \
            scripts/apply-scheduled-newsletters.py.gz.b64 \
            scripts/apply-scheduled-newsletters.py.gz.b64.part* \
            scripts/apply-scheduled-newsletters.trigger \
            scripts/finalize-scheduled-newsletters.py
          git rm .github/workflows/apply-scheduled-newsletters.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            api/src/resendMarketing.ts \
            api/src/marketing.ts \
            api/src/marketingCampaignDelivery.ts \
            api/src/marketingSchedule.ts \
            api/src/marketingSchedule.test.ts \
            api/src/campaignSendSafety.ts \
            api/src/server.ts \
            api/src/marketingSchedulingIntegration.test.ts \
            api/README.md \
            scripts/email-marketing-foundation.test.mjs \
            scripts/email-marketing-safe-send.test.mjs \
            src/lib/marketing.ts \
            src/components/marketing/CampaignWorkspace.tsx
          git commit -m "feat(marketing): schedule and cancel newsletters"

      - name: Use public npm registry
        run: npm config set registry https://registry.npmjs.org/

      - name: Install frontend dependencies
        run: npm ci

      - name: Type-check frontend
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test frontend
        run: npm test

      - name: Build frontend
        run: npm run build
        env:
          SITE_URL: https://eivitech.com
          VITE_SITE_URL: https://eivitech.com

      - name: Install API dependencies
        run: npm --prefix api install

      - name: Test API with mocked provider calls
        run: npm --prefix api test

      - name: Build API
        run: npm --prefix api run build

      - name: Push verified commit
        shell: bash
        run: |
          set -euo pipefail
          git push origin HEAD:feat/scheduled-newsletters
