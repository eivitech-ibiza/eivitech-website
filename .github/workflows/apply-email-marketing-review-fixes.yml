name: Apply email marketing review fixes

on:
  pull_request:
    branches:
      - main
    types: [synchronize]

permissions:
  contents: write

concurrency:
  group: apply-email-marketing-review-fixes-${{ github.head_ref }}
  cancel-in-progress: true

jobs:
  patch:
    if: github.head_ref == 'feat/free-email-marketing-foundation'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Apply review fixes
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          def replace_once(path: str, old: str, new: str) -> None:
              file = Path(path)
              text = file.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"Expected one exact match in {path}, found {count}: {old[:80]!r}")
              file.write_text(text.replace(old, new, 1))

          def replace_regex(path: str, pattern: str, replacement: str) -> None:
              file = Path(path)
              text = file.read_text()
              updated, count = re.subn(pattern, replacement, text, count=1, flags=re.S)
              if count != 1:
                  raise SystemExit(f"Expected one regex match in {path}, found {count}: {pattern[:100]!r}")
              file.write_text(updated)

          server = "api/src/server.ts"
          replace_once(server, 'app.use(express.json({ limit: "2mb" }));\n', '')
          replace_once(
              server,
              'app.use(clerkMiddleware());\n',
              'app.use(clerkMiddleware());\n\n'
              'const publicJsonParser = express.json({ limit: "100kb" });\n'
              'const crmJsonParser = express.json({ limit: "100kb" });\n'
              'const marketingJsonParser = express.json({ limit: "12mb" });\n'
          )
          replace_once(
              server,
              '  requireRole(["admin", "manager"]),\n  marketingRouter\n',
              '  requireRole(["admin", "manager"]),\n  marketingJsonParser,\n  marketingRouter\n'
          )
          replace_once(
              server,
              'app.post("/api/leads", publicLeadLimiter, async (req, res) => {',
              'app.post("/api/leads", publicLeadLimiter, publicJsonParser, async (req, res) => {'
          )
          replace_once(
              server,
              '  }\n});\n\napp.get("/api/leads", requireCrmUser, async (_req, res) => {',
              '  }\n});\n\napp.use("/api/leads", crmJsonParser);\n\napp.get("/api/leads", requireCrmUser, async (_req, res) => {'
          )

          marketing = "api/src/marketing.ts"
          replace_regex(
              marketing,
              r'const importSchema = z\.object\(\{.*?\n\}\);\n\nconst segmentSchema',
              '''const importIssueSchema = z.object({
  row: z.number().int().min(2).max(1001),
  email: z.string().trim().max(254).optional(),
  message: z.string().trim().min(1).max(500),
});

const importSchema = z.object({
  file_name: optionalText(255),
  contacts: z.array(z.unknown()).max(1000),
  contact_rows: z.array(z.number().int().min(2).max(1001)).max(1000).optional(),
  client_issues: z.array(importIssueSchema).max(1000).optional(),
  total_rows: z.number().int().min(0).max(1000).optional(),
}).superRefine((data, ctx) => {
  const clientIssueCount = data.client_issues?.length ?? 0;
  const accountedRows = data.contacts.length + clientIssueCount;
  const totalRows = data.total_rows ?? accountedRows;

  if (accountedRows === 0) {
    ctx.addIssue({ code: z.ZodIssueCode.custom, message: "The import contains no data rows" });
  }
  if (data.contact_rows && data.contact_rows.length !== data.contacts.length) {
    ctx.addIssue({ code: z.ZodIssueCode.custom, message: "contact_rows must match contacts length" });
  }
  if (totalRows !== accountedRows) {
    ctx.addIssue({ code: z.ZodIssueCode.custom, message: "total_rows must equal valid contacts plus client issues" });
  }
});

const segmentSchema'''
          )
          replace_once(
              marketing,
              '  consent_at: Date | string | null;\n  suppression_reason: string | null;\n',
              '  consent_at: Date | string | null;\n  unsubscribed_at: Date | string | null;\n  suppressed_at: Date | string | null;\n  suppression_reason: string | null;\n'
          )
          replace_regex(
              marketing,
              r'function normalizeContact\(data: z\.infer<typeof contactSchema>\) \{.*?\n\}\n\nasync function upsertContact',
              '''function normalizeContact(data: z.infer<typeof contactSchema>) {
  const explicitStatus = data.status;
  const terminalStatus = explicitStatus === "unsubscribed" || explicitStatus === "suppressed"
    ? explicitStatus
    : null;
  const stateProvided = explicitStatus !== undefined || data.marketing_consent !== undefined;
  const marketingConsent = terminalStatus
    ? false
    : data.marketing_consent ?? explicitStatus === "subscribed";
  const status = terminalStatus ?? (marketingConsent ? "subscribed" : "pending");
  const now = new Date().toISOString();

  return {
    email: data.email.toLowerCase(),
    firstName: cleanText(data.first_name),
    lastName: cleanText(data.last_name),
    phone: cleanText(data.phone),
    address: cleanText(data.address),
    region: cleanText(data.region),
    countryCode: cleanText(data.country_code)?.toLowerCase() || null,
    language: data.language || null,
    contactType: cleanText(data.contact_type),
    source: cleanText(data.source),
    sourceFile: cleanText(data.source_file),
    status,
    tags: normalizeTags(data.tags),
    tagsProvided: data.tags !== undefined,
    stateProvided,
    marketingConsent,
    consentSource: cleanText(data.consent_source),
    consentAt: marketingConsent ? data.consent_at || now : null,
    unsubscribedAt: status === "unsubscribed" ? now : null,
    suppressedAt: status === "suppressed" ? now : null,
    suppressionReason: status === "suppressed" ? cleanText(data.suppression_reason) : null,
  };
}

async function upsertContact'''
