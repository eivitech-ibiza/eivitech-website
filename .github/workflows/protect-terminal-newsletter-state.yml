name: Protect terminal newsletter state

on:
  push:
    branches:
      - feat/scheduled-newsletters
    paths:
      - scripts/protect-terminal-newsletter-state.trigger

permissions:
  contents: write

concurrency:
  group: protect-terminal-newsletter-state
  cancel-in-progress: true

jobs:
  patch-test-and-commit:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: feat/scheduled-newsletters
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Apply terminal-state patch
        shell: bash
        run: |
          set -euo pipefail
          python scripts/protect-terminal-newsletter-state.py
          git diff --check

      - name: Prepare candidate commit
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            api/src/marketingCampaignDelivery.ts \
            api/src/marketingConcurrencyIntegration.test.ts \
            scripts/marketing-scheduling.test.mjs \
            src/components/marketing/CampaignWorkspace.tsx
          git rm -f \
            scripts/protect-terminal-newsletter-state.py \
            scripts/protect-terminal-newsletter-state.trigger \
            .github/workflows/protect-terminal-newsletter-state.yml
          git commit -m "fix(marketing): preserve terminal campaign states"

      - name: Use public npm registry
        run: npm config set registry https://registry.npmjs.org/

      - name: Install frontend dependencies
        run: npm ci

      - name: Type-check frontend
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test frontend
        run: npm test

      - name: Build frontend
        run: npm run build
        env:
          SITE_URL: https://eivitech.com
          VITE_SITE_URL: https://eivitech.com

      - name: Install API dependencies
        run: npm --prefix api install

      - name: Test API with mocked provider calls
        run: npm --prefix api test

      - name: Build API
        run: npm --prefix api run build

      - name: Push verified commit
        shell: bash
        run: |
          set -euo pipefail
          git push origin HEAD:feat/scheduled-newsletters
