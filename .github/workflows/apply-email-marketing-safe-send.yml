name: Apply email marketing safe send

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: apply-safe-send-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apply-and-verify:
    if: ${{ hashFiles('scripts/apply-email-marketing-safe-send.py') != '' }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Apply integration
        run: python scripts/apply-email-marketing-safe-send.py

      - name: Render branded social preview
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends librsvg2-bin
          mkdir -p public/media/social
          rsvg-convert \
            --format=png \
            --width=1200 \
            --height=630 \
            --output=public/media/social/eivitech-og-brand-preview-v1.png \
            assets/social/eivitech-og-brand-preview-v1.svg

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install frontend dependencies
        run: npm ci

      - name: Type-check
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build frontend
        run: npm run build
        env:
          SITE_URL: https://eivitech.com
          VITE_SITE_URL: https://eivitech.com

      - name: Build CRM API
        run: |
          npm --prefix api install
          npm --prefix api run build

      - name: Verify SEO output
        run: npm run seo:check

      - name: Audit production dependencies
        run: npm run audit:prod

      - name: Commit generated implementation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Implement safe email marketing tests and unsubscribe flow"
          git push origin HEAD:${{ github.head_ref }}
