name: Generate audited dependency lockfile

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  generate:
    if: github.head_ref == 'chore/npm-audit-remediation'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Use public npm registry
        run: npm config set registry https://registry.npmjs.org/

      - name: Upgrade React Router and safe production dependencies
        run: |
          npm install react-router-dom@7.18.2 --save
          npm audit fix --omit=dev

      - name: Verify production audit
        run: npm audit --omit=dev --audit-level=high

      - name: Upload generated package files
        uses: actions/upload-artifact@v4
        with:
          name: audited-package-files
          path: |
            package.json
            package-lock.json
          if-no-files-found: error
