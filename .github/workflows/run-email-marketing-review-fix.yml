name: Run email marketing review fix

on:
  pull_request:
    branches:
      - main
    types: [reopened]

permissions:
  contents: write

concurrency:
  group: run-email-marketing-review-fix-${{ github.head_ref }}
  cancel-in-progress: true

jobs:
  patch:
    if: github.head_ref == 'feat/free-email-marketing-foundation'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Extract and run patch
        shell: bash
        run: |
          python - <<'PYRUN'
          from pathlib import Path

          source = Path('.github/workflows/apply-email-marketing-review-fixes.yml').read_text()
          marker = "          python - <<'PY'\n"
          start = source.index(marker) + len(marker)
          end = source.index("\n          PY", start)
          embedded = source[start:end]
          lines = [line[10:] if line.startswith('          ') else line for line in embedded.splitlines()]
          script = '\n'.join(lines) + '\n'
          script = script.replace(
              "re.subn(pattern, replacement, text, count=1, flags=re.S)",
              "re.subn(pattern, lambda _match: replacement, text, count=1, flags=re.S)",
          )
          script = script.replace(
              "scripts/email-marketing.test.mjs",
              "scripts/email-marketing-foundation.test.mjs",
          )
          Path('/tmp/apply-email-marketing-review-fixes.py').write_text(script)
          PYRUN
          python /tmp/apply-email-marketing-review-fixes.py
          rm -f .github/workflows/run-email-marketing-review-fix.yml

      - name: Refresh regression expectations
        shell: bash
        run: |
          python - <<'PYTEST'
          from pathlib import Path

          path = Path('scripts/email-marketing-foundation.test.mjs')
          text = path.read_text()
          replacements = {
              'assert.match(server, /express\\.json\\(\\{ limit: "2mb" \\}\\)/);':
                  'assert.match(server, /const marketingJsonParser = express\\.json\\(\\{ limit: "12mb" \\}\\)/);',
              'assert.match(marketing, /contacts: z\\.array\\(z\\.unknown\\(\\)\\)\\.min\\(1\\)\\.max\\(1000\\)/);':
                  'assert.match(marketing, /contacts: z\\.array\\(z\\.unknown\\(\\)\\)\\.max\\(1000\\)/);',
              'assert.match(page, /const totalSkipped = parsed\\.issues\\.length \\+ result\\.skipped/);':
                  'assert.match(page, /clientIssues: parsed\\.issues/);',
              'assert.match(page, /const allIssues = \\[/);':
                  'assert.match(page, /totalRows: parsed\\.totalRows/);',
              'assert.match(page, /\\.slice\\(0, 5\\)/);':
                  'assert.match(page, /result\\.errors\\s*\\.slice\\(0, 5\\)/);',
              'assert.match(marketing, /consent_at: parsed\\.data\\.consent_at \\?\\? isoString\\(existing\\.consent_at\\)/);':
                  'assert.match(marketing, /consent_at: requestedConsent \\? parsed\\.data\\.consent_at \\?\\? isoString\\(existing\\.consent_at\\) : null/);',
          }
          for old, new in replacements.items():
              if old not in text:
                  raise SystemExit(f'Missing expected legacy assertion: {old}')
              text = text.replace(old, new, 1)
          path.write_text(text)
          PYTEST

      - name: Verify changes
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends librsvg2-bin
          mkdir -p public/media/social
          rsvg-convert \
            --format=png \
            --width=1200 \
            --height=630 \
            --output=public/media/social/eivitech-og-brand-preview-v1.png \
            assets/social/eivitech-og-brand-preview-v1.svg
          test -s public/media/social/eivitech-og-brand-preview-v1.png
          npm config set registry https://registry.npmjs.org/
          npm ci
          npm run typecheck
          npm run lint
          npm test
          npm run build
          npm --prefix api install
          npm --prefix api run build
          npm run seo:check
          npm run audit:prod
        env:
          SITE_URL: https://eivitech.com
          VITE_SITE_URL: https://eivitech.com

      - name: Commit fixes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: address final email marketing review findings"
          git push origin HEAD:${{ github.head_ref }}
